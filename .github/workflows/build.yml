name: build
on:
  push:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.24.5, channel: stable, cache: true }
      - run: bash scripts/bootstrap.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Set repository variable API_BASE_URL to your deployed https://.../api
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - run: flutter build web --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: myday-apk, path: frontend/mobile/build/app/outputs/flutter-apk/app-release.apk }
      - uses: actions/upload-artifact@v4
        with: { name: myday-web, path: frontend/mobile/build/web }
